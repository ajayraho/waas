spring:
  application:
    name: core-queue-service

  # Java 21 virtual threads for request handling: a burst of joins that block
  # on Postgres/Redis I/O no longer needs one platform thread each.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/waas}
    username: ${DB_USER:waas}
    password: ${DB_PASSWORD:waas}
    hikari:
      # Sized from the k6 run: at 20, a 500-user burst queued for connections.
      # Keep (instances x pool) under Postgres max_connections (100 by default).
      maximum-pool-size: ${DB_POOL_SIZE:50}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always   # dev/demo: the dashboard shows db + redis status
  info:
    env:
      enabled: true

info:
  service: core-queue-service

waas:
  referral:
    # Fraud velocity check: max referrals credited per referrer per waitlist per window.
    # Beyond it, referrals are recorded as REJECTED (audit trail) and earn nothing.
    velocity-limit: ${REFERRAL_VELOCITY_LIMIT:5}
    velocity-window: ${REFERRAL_VELOCITY_WINDOW:60s}
  auth:
    # HS256 needs at least 32 bytes. Override JWT_SECRET outside local dev.
    jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    token-ttl: 12h
  admission:
    rate-limit: ${RATE_LIMIT:20}      # write requests per user per window
    rate-window: ${RATE_WINDOW:10s}
