# Same routes as the Vite dev proxy (vite.config.ts) — the SPA only uses relative URLs.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://core-queue-service:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /core/actuator/ {
    proxy_pass http://core-queue-service:8080/actuator/;
  }

  # Gateway HTTP endpoints: /gateway/actuator/..., /gateway/stats
  location /gateway/ {
    proxy_pass http://websocket-gateway:8081/;
  }

  # WebSocket upgrade. Long read timeout: STOMP heartbeats keep the socket alive.
  location /ws {
    proxy_pass http://websocket-gateway:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
