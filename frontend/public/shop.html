<!doctype html>
<!--
  A made-up shop ("Kicks & Co.") that plugs into WaaS: the Integrate snippet, and nothing else.
  No build step, no framework, no libraries. One file the shop would host on its own site.

  Open: http://localhost:3000/shop.html            (the AirMax Drop waitlist)
        http://localhost:3000/shop.html?w=<id>     (any other waitlist)

  It's served from the same origin as the API. A real shop on its own domain would also need
  CORS on Core for its domain (the gateway already has an allowed-origins list for /ws).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kicks &amp; Co. — the drop</title>
  <link rel="icon" href="data:," />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4efe6; color: #1b1b1b;
           font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(420px, 100% - 32px); }
    h1 { font-size: 40px; line-height: 1; margin: 0 0 6px; letter-spacing: -0.02em; }
    .sub { color: #6b6257; margin: 0 0 28px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; border: 2px solid #1b1b1b; border-radius: 10px; font: inherit; background: #fff; }
    button { padding: 12px 18px; border: 0; border-radius: 10px; background: #1b1b1b; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }
    #status { margin-top: 24px; padding: 20px; border-radius: 14px; background: #fff; display: none; }
    .big { font-size: 56px; font-weight: 800; line-height: 1; }
    .turn { background: #ffe07a !important; }
    .done { background: #c9f0d4 !important; }
    .gone { background: #f6d2cc !important; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Kicks &amp; Co.</h1>
    <p class="sub" id="sub">Get in line, we'll tell you when it's your turn to buy.</p>

    <form id="join">
      <input id="name" placeholder="Your name" required maxlength="100" />
      <button>Get in line</button>
    </form>
    <div id="status"></div>
  </main>

  <script type="module">
    const API = window.location.origin // the WaaS instance (same origin here)
    const WAITLIST = new URLSearchParams(location.search).get('w') ?? '10000000-0000-0000-0000-000000000001'
    const $ = (id) => document.getElementById(id)
    let token, entryId, timer

    // the waitlist's public info (no key needed) for the heading
    fetch(`${API}/api/waitlists/${WAITLIST}`).then((r) => r.json()).then((w) => {
      $('title').textContent = w.name
      if (w.description) $('sub').textContent = `${w.description}. We'll tell you when it's your turn.`
    })

    $('join').onsubmit = async (e) => {
      e.preventDefault()
      $('join').querySelector('button').disabled = true

      // 1. a token for your customer (or bring your own users)
      ;({ token } = await fetch(`${API}/api/auth/guest`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: $('name').value }),
      }).then((r) => r.json()))

      // 2. join the line (safe to retry: send an Idempotency-Key)
      const entry = await fetch(`${API}/api/waitlists/${WAITLIST}/entries`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Idempotency-Key': crypto.randomUUID() },
      }).then((r) => r.json())
      entryId = entry.entryId
      show(entry.position)

      // 3. live position, pushed over STOMP
      live(API.replace(/^http/, 'ws') + '/ws', [
        `/app/waitlists/${WAITLIST}/entries/${entryId}`, // current state, once
        `/topic/waitlists/${WAITLIST}/entries/${entryId}`, // then every change
      ], show)
    }

    // STOMP is plain text frames over a WebSocket: "COMMAND\nheader:value\n\nbody\0".
    // This is all a read-only client needs. (@stomp/stompjs adds reconnects and heartbeats.)
    function live(url, destinations, onJson) {
      const ws = new WebSocket(url)
      const frame = (cmd, headers) =>
        `${cmd}\n${Object.entries(headers).map(([k, v]) => `${k}:${v}`).join('\n')}\n\n\0`
      ws.onopen = () => ws.send(frame('CONNECT', { 'accept-version': '1.2', host: location.hostname, 'heart-beat': '0,0' }))
      ws.onmessage = ({ data }) => {
        const cut = data.indexOf('\n\n')
        const command = data.slice(0, data.indexOf('\n'))
        if (command === 'CONNECTED') {
          destinations.forEach((d, i) => ws.send(frame('SUBSCRIBE', { id: `sub-${i}`, destination: d })))
        } else if (command === 'MESSAGE') {
          onJson(JSON.parse(data.slice(cut + 2).replace(/\0$/, '')))
        }
      }
    }

    // { state, position, queueSize, expiresAt } → what the customer sees
    function show(p) {
      const box = $('status')
      box.style.display = 'block'
      box.className = ''
      clearInterval(timer)
      if (p.state === 'WAITING') {
        box.innerHTML = `<div class="big">#${p.position}</div>in line, ${p.queueSize - p.position} behind you`
      } else if (p.state === 'RESERVED') {
        box.className = 'turn'
        const tick = () => {
          const s = Math.max(0, Math.round((Date.parse(p.expiresAt) - Date.now()) / 1000))
          box.innerHTML = `<div class="big">Your turn!</div>${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} left to buy
            <p><button id="buy">Buy now</button></p>`
          $('buy').onclick = buy
        }
        tick()
        timer = setInterval(tick, 1000)
      } else if (p.state === 'CONFIRMED') {
        box.className = 'done'
        box.innerHTML = `<div class="big">Got 'em.</div>Your pair is on its way.`
      } else {
        box.className = 'gone'
        box.innerHTML = `<div class="big">Missed it.</div>Your turn ran out (${p.state.toLowerCase()}).`
      }
    }

    // the customer finished checkout: tell WaaS, which frees the slot for the next person
    async function buy() {
      $('buy').disabled = true
      await fetch(`${API}/api/waitlists/${WAITLIST}/entries/${entryId}/confirm`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
      })
    }
  </script>
</body>
</html>
