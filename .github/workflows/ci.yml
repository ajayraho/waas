name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: core-queue-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-queue-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: core-queue-service/pom.xml
      # Tests use Testcontainers (real Postgres + Redis); GitHub's Ubuntu runners have Docker.
      - run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core-queue-service/target/surefire-reports

  gateway:
    name: websocket-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: websocket-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: websocket-gateway/pom.xml
      - run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-reports
          path: websocket-gateway/target/surefire-reports

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    name: docker images
    needs: [core, gateway, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
