<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WaaS">
  <title>WaaS</title>
  <style>
    /* The ring ticks a quarter turn four times (one full lap per 6 s, so the loop is seamless);
       the three people in line hop forward after every tick. Same motion as the app's hover. */
    .ring { transform-box: view-box; transform-origin: 256px 256px; animation: tick 6s infinite; }
    .dot { transform-box: fill-box; transform-origin: center; animation: hop 1.5s ease-out infinite; }
    .d2 { animation-delay: 0.08s; }
    .d3 { animation-delay: 0.16s; }
    @keyframes tick {
      0%   { transform: rotate(0deg);   animation-timing-function: cubic-bezier(0.3, 1.4, 0.5, 1); }
      9%   { transform: rotate(90deg); }
      25%  { transform: rotate(90deg);  animation-timing-function: cubic-bezier(0.3, 1.4, 0.5, 1); }
      34%  { transform: rotate(180deg); }
      50%  { transform: rotate(180deg); animation-timing-function: cubic-bezier(0.3, 1.4, 0.5, 1); }
      59%  { transform: rotate(270deg); }
      75%  { transform: rotate(270deg); animation-timing-function: cubic-bezier(0.3, 1.4, 0.5, 1); }
      84%  { transform: rotate(360deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes hop {
      0%, 30%, 100% { transform: none; }
      13% { transform: translateY(-14%) scale(1.25); }
    }
    @media (prefers-reduced-motion: reduce) { .ring, .dot { animation: none; } }
  </style>
  <rect width="512" height="512" rx="104" fill="#1c2733"/>
  <path class="ring" d="M 256 119 A 137 137 0 1 0 393 256" fill="none" stroke="#e8ecef" stroke-width="13"/>
  <circle class="dot" cx="256" cy="195.4" r="18.5" fill="#d9b06b"/>
  <circle class="dot d2" cx="256" cy="256" r="18.5" fill="#d9b06b"/>
  <circle class="dot d3" cx="256" cy="316.6" r="18.5" fill="#d9b06b"/>
</svg>
